services:
  api:
    build: .
    ports:
      # El Nginx del servidor es el único punto de entrada público.
      - "127.0.0.1:8080:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL en el archivo .env del servidor}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:?Define FRONTEND_ORIGINS en el archivo .env del servidor}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_COOKIE_SECURE: "true"
      UPLOAD_DIR: /app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - uploads_data:/app/data/uploads

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: alejandra
      POSTGRES_USER: alejandra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env del servidor}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alejandra -d alejandra"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  uploads_data:

services:
  api:
    build: .
    ports:
      - "8080:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://alejandra:alejandra@db:5432/alejandra
      FRONTEND_ORIGINS: http://localhost:3000
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: alejandra
      POSTGRES_USER: alejandra
      POSTGRES_PASSWORD: alejandra
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alejandra -d alejandra"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
